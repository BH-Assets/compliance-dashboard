<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#f5f7fa; color:#1f2733; }
  .wrap { max-width:1300px; margin:0 auto; padding:20px; }
  h1 { font-size:22px; margin:0 0 2px; color:#1F3864; }
  .sub { color:#5b6472; font-size:13px; margin-bottom:14px; }
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .controls label { font-size:13px; color:#40485a; font-weight:bold; }
  select { padding:8px 12px; border:1px solid #c7cfdb; border-radius:8px; font-size:14px; background:#fff; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid #e3e8f0; border-radius:10px; padding:13px 15px; }
  .card .n { font-size:25px; font-weight:bold; } .card .l { font-size:11.5px; color:#5b6472; margin-top:2px; text-transform:uppercase; letter-spacing:.03em; }
  .total .n{color:#1F3864} .ok .n{color:#1a7f37} .soon .n{color:#9a6a00} .bad .n{color:#b3261e} .gap .n{color:#1a4fb0}
  .section-title { font-size:15px; font-weight:bold; color:#1F3864; margin:22px 0 10px; }
  .tablescroll { overflow-x:auto; border-radius:10px; }
  .scrolltop { overflow-x:auto; overflow-y:hidden; }
  .scrolltop > div { height:1px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04); font-size:12px; }
  th,td { padding:7px 8px; text-align:center; border-bottom:1px solid #eef1f6; white-space:nowrap; }
  th { background:#2F5496; color:#fff; font-size:11px; position:sticky; top:0; }
  td.l, th.l { text-align:left; }
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold}
  .g{background:#C6EFCE;color:#006100}.y{background:#FFEB9C;color:#9C6500}.r{background:#FFC7CE;color:#9C0006}.b{background:#DDEBF7;color:#1F3864}.muted{color:#9aa2b1}
  .nc-card{background:#fff;border:1px solid #f0c2c2;border-left:4px solid #b3261e;border-radius:8px;padding:11px 13px;margin-bottom:9px}
  .gap-card{background:#fff;border:1px solid #b7ccf5;border-left:4px solid #1a4fb0;border-radius:8px;padding:11px 13px;margin-bottom:9px}
  .nc-card h4,.gap-card h4{margin:0 0 3px;font-size:13.5px}
  .nc-proj{font-size:12px;color:#5b6472;font-weight:normal}
  .rsn{margin:5px 0 0;padding-left:16px;font-size:12px;color:#7a1d16}
  .gap-card .rsn{color:#1a3a7a}
  .flags{font-size:11px;color:#5b6472;margin-top:3px}
  .empty{color:#5b6472;font-style:italic;padding:10px 0}
  .loading{padding:40px;text-align:center;color:#5b6472}
  .legend{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:12.5px;line-height:2;color:#40485a}
  .legend b{color:#1F3864}
  .legend .pill{margin:0 2px}
  .legend .grp{display:inline-block;margin-right:18px;white-space:nowrap}
  .vcard{background:#fff;border:1px solid #e3e8f0;border-left:6px solid #1a4fb0;border-radius:10px;padding:11px 15px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .vcard.g{border-left-color:#1a7f37}.vcard.y{border-left-color:#c99a00}.vcard.r{border-left-color:#b3261e}
  .vhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .vname{font-weight:bold;font-size:14.5px;color:#1f2733}
  a.vlink{text-decoration:none}a.vlink:hover{color:#2F5496;text-decoration:underline}
  .vtype{font-size:12px;color:#5b6472}
  .gtag{background:#DDEBF7;color:#1F3864;border:1px solid #b7ccf5;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:bold}
  .vright{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:#8a92a1}
  .vsub{font-size:11.5px;color:#8a92a1;margin-top:2px}
  .vcov{margin-top:8px;display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:9px 10px;align-items:start}
  .mini{font-size:11px;color:#40485a;display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:nowrap}
  .mlabel{color:#7a828f;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em}
  .mdate{color:#8a92a1;font-size:10px}
  .cpill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:bold}
  .cpill.g{background:#C6EFCE;color:#006100}.cpill.y{background:#FFEB9C;color:#9C6500}.cpill.r{background:#FFC7CE;color:#9C0006}.cpill.muted{background:#eef1f6;color:#8a92a1}
  .vnotes{margin-top:7px;font-size:11.5px;line-height:1.55;color:#40485a;border-top:1px solid #f0f2f6;padding-top:6px}
  .vact{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .reqwhen{font-size:11px;font-style:italic;color:#8a92a1}
  .projgrp{margin:18px 0 8px;padding:6px 10px;background:#eef2f8;border-left:4px solid #2F5496;border-radius:4px;font-weight:bold;font-size:13.5px;color:#1f2733;display:flex;align-items:center;gap:8px}
  .projgrp:first-child{margin-top:0}
  .projgrp .cnt{font-weight:normal;font-size:11.5px;color:#6b7480}
  .exportbar{margin:22px 0 8px;text-align:right}
  #exportbtn{padding:10px 20px;border:1px solid #1a7f37;background:#1a7f37;color:#fff;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
  #exportbtn:hover{background:#166a2e}
  .reqbtn{display:inline-block;padding:6px 12px;border:1px solid #2F5496;color:#2F5496;background:#fff;border-radius:8px;font-size:12px;font-weight:bold;text-decoration:none}
  .reqbtn:hover{background:#2F5496;color:#fff}
  .reqbtn:disabled{opacity:.45;cursor:not-allowed;border-color:#aab3c0;color:#8a92a1;background:#fff}
  .reqbtn:disabled:hover{background:#fff;color:#8a92a1}
  .upbtn{display:inline-block;padding:6px 12px;border:1px solid #2e7d32;color:#2e7d32;background:#fff;border-radius:8px;font-size:12px;font-weight:bold;text-decoration:none}
  .upbtn:hover{background:#2e7d32;color:#fff}
  @media(max-width:640px){
    .wrap{padding:12px}
    h1{font-size:19px}
    .controls{gap:8px}
    .controls label{width:100%;margin:0}
    .controls select,.controls input{width:100%;min-width:0}
    #syncbtn{margin-left:0!important;width:100%}
    .cards{grid-template-columns:repeat(2,1fr)}
    .vcov{grid-template-columns:repeat(3,1fr)}
    .vhead{gap:6px}
    .vright{margin-left:0;width:100%;justify-content:flex-start}
    .legend{font-size:11px;line-height:1.8}
  }
  footer{margin-top:26px;font-size:11.5px;color:#8a92a1;border-top:1px solid #e3e8f0;padding-top:12px;line-height:1.5}
</style>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.7.1/lib/msal-browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Subcontractor / Vendor Compliance Dashboard</h1>
  <div class="sub">Bailey Harris Construction &middot; live from Procore + Alabama GCL + Billy, via SharePoint &middot; <span id="asof">loading…</span></div>
  <div id="banner" class="banner" style="display:none"></div>
  <div id="content"><div class="loading">Loading compliance data from SharePoint…</div></div>
  <footer id="foot"></footer>
</div>
<script>
// ==== Microsoft sign-in (MSAL) config ====
const MSAL_CLIENT_ID = '4bb1f92c-c0a9-4dd6-97a3-2d8c8c9fe27a';    // Azure SPA app registration (client) ID
const TENANT = '848aa890-7982-4028-befa-3323d82583ce';           // Bailey Harris tenant
const SCOPES = ['Files.Read.All','User.Read'];                    // Graph read + identity (for Sync)
const SYNC_WORKER_URL = 'https://bh-compliance-sync.soft-math-3331.workers.dev/';  // set to your Cloudflare Worker URL to enable the Sync button
const DRIVE_ID = 'b!UgjUeEqLf0e6Z37An3qt5NP_8dR2rQJBoZpkPrOgBP0b4x1AxB_JT5QG_didjvoe';
const ITEM_ID  = '01DG2CN7YZK66GZHQHD5ALV5QO4M275DKG';
const THRESHOLD = 30;
// ==== Billy deep-links (PM uploads a file directly in Billy's Documents tab) ====
const BILLY_TEAM = 'bailey-harris-construction-co-inc';
const BILLY_DOCS_BASE = 'https://app.billyforinsurance.com/teams/' + BILLY_TEAM;
function billyVendorDocs(r){ return r.vendor_id ? (BILLY_DOCS_BASE+'/directory/vendors/'+r.vendor_id+'/Documents') : ''; }
function billyInsuranceDocs(r){
  if(r.global_coi==='Yes') return billyVendorDocs(r);                                   // global blanket COI -> company directory
  if(r.billy_project_id && r.billy_contract_id)                                          // project-specific (subs AND POs use /subcontract/)
    return BILLY_DOCS_BASE+'/projects/'+r.billy_project_id+'/subcontract/'+r.billy_contract_id+'/Documents';
  return billyVendorDocs(r);                                                             // missing ids -> safe fallback (company directory)
}
function billyVendorLink(r){                                                             // vendor name -> Billy record
  if(r.global_coi!=='Yes' && r.billy_project_id && r.billy_contract_id)
    return BILLY_DOCS_BASE+'/projects/'+r.billy_project_id+'/subcontract/'+r.billy_contract_id+'/Coverages';   // project-specific -> project vendor Coverages
  return r.vendor_id ? (BILLY_DOCS_BASE+'/directory/vendors/'+r.vendor_id+'/Details') : '';                     // global / fallback -> directory Details
}
// Billy stores last_requested only on CONTRACTS; company-level (global) requests
// aren't readable from GET /vendors. So we remember the moment a request was sent
// from this dashboard (per browser) and merge it with the pulled contract value.
function reqKey(r){ return (r.global_coi==='Yes') ? ('v:'+(r.vendor_id||'')) : ('c:'+(r.billy_contract_id||'')); }
function localLastReq(k){ try{ return localStorage.getItem('bh_lr_'+k)||''; }catch(e){ return ''; } }
function setLocalLastReq(k,iso){ try{ localStorage.setItem('bh_lr_'+k, iso); }catch(e){} }
let LR_MAP={};  // shared last-requested map from the Worker (KV), keyed like reqKey()
function effLastReq(r){ const k=reqKey(r); return [r.last_requested||'', localLastReq(k), LR_MAP[k]||''].sort().slice(-1)[0]; }  // newest wins (ISO sorts chronologically)
let ROWS = [], GENERATED = '';
const msalApp = new msal.PublicClientApplication({
  auth: { clientId: MSAL_CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT,
          redirectUri: window.location.origin + window.location.pathname },
  cache: { cacheLocation: 'sessionStorage' }
});
async function getToken(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  let account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { const t = await msalApp.acquireTokenSilent({ scopes: SCOPES, account }); return t.accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}

function dcell(v){
  if(v==='waived') return '<td><span class="muted">waived</span></td>';
  if(v==='missing'||v==='expired') return '<td><span class="pill r">&lt;0</span></td>';  // expired / no current coverage
  if(v===null||v===undefined||v==='') return '<td><span class="muted">&mdash;</span></td>';  // not required
  const d=Number(v); if(isNaN(d)) return '<td><span class="muted">&mdash;</span></td>';
  if(d<0) return '<td><span class="pill r">&lt;0</span></td>';
  const c=d<=THRESHOLD?'y':'g';
  return `<td><span class="pill ${c}">${d}</span></td>`;
}
const stPill=s=>`<span class="pill ${s==='Compliant'?'g':s==='Expiring Soon'?'y':s==='Data Gap'?'b':'r'}">${s}</span>`;
const okPill=v=>`<span class="pill ${v==='Yes'?'g':v==='Verify'?'y':'r'}">${v}</span>`;

async function load(){
  try{
    const token = await getToken();
    if(!token) return; // redirecting to Microsoft sign-in
    const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/content`, { headers: { Authorization: 'Bearer ' + token } });
    if(!res.ok) throw new Error('Graph HTTP '+res.status+' (need SharePoint access to the file)');
    const data = await res.json();
    if (!data || !Array.isArray(data.rows)) throw new Error('Unexpected data shape');
    ROWS = data.rows; GENERATED = data.generated_at || '';
    document.getElementById('asof').textContent = GENERATED ? ('data as of ' + new Date(GENERATED).toLocaleString()) : '';
    await loadLastReqMap(token);   // shared "last requested" (company-level not readable from Billy's API)
    buildUI();
  }catch(e){
    const b=document.getElementById('banner'); b.style.display='block'; b.className='banner err';
    b.textContent='Sign-in or data load failed: '+(e&&e.message||e);
    document.getElementById('content').innerHTML='';
  }
}
function buildUI(){
  const projects=[...new Set(ROWS.map(r=>r.project))].sort();
  document.getElementById('content').innerHTML=`
    <div class="legend">
      <span class="grp"><b>Days to expiration:</b></span>
      <span class="grp"><span class="pill g">30+</span> current</span>
      <span class="grp"><span class="pill y">1&ndash;30</span> expiring soon</span>
      <span class="grp"><span class="muted">waived</span> exempt in Billy</span>
      <span class="grp"><span class="pill r">expired/missing</span> expired / no coverage on file</span>
      <span class="grp"><span class="cpill muted">&mdash;</span> not required for this vendor</span>
      <br>
      <span class="grp">GC License required for subs with a Procore commitment &ge; $100k; <span class="pill g" style="font-size:9px">&check;AL</span> = verified on the Alabama GC website. W-9 tracked for all vendors (does not block). Non-Compliant = cannot be on site or paid.</span>
    </div>
    <div class="controls">
      <label>View:</label>
      <select id="proj"><option value="ALL">All projects</option><option value="GLOBAL">Global COI vendors</option><option value="MISSING">Billy Missing Docs</option>${projects.map(p=>`<option>${p}</option>`).join('')}</select>
      <span id="filtwrap"><label style="margin-left:8px">Filter:</label>
      <select id="filt"><option value="all">All vendors</option><option value="compliant">Compliant</option><option value="soon">Expiring soon</option><option value="nc">Non-compliant</option><option value="nogcl">Missing GC License</option><option value="now9">Missing W-9</option><option value="noins">Missing insurance doc</option></select></span>
      <span id="qwrap"><label style="margin-left:8px">Search vendor:</label>
      <input id="q" type="text" placeholder="type a vendor name…" style="padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:14px;min-width:220px"></span>
      <button id="syncbtn" title="Re-run the pull and refresh the data" style="margin-left:auto;padding:8px 16px;border:1px solid #2F5496;background:#2F5496;color:#fff;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer">↻ Sync now</button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="section-title" id="vendors-title">Vendors</div>
    <div id="list"></div>
    <div class="section-title" id="valid-title">Documents to add to Billy (from Procore / Alabama)</div><div id="valid"></div>
    <div class="exportbar"><button id="exportbtn" title="Download an Excel (.xlsx) of subcontractors (name, contract amount, GC license # &amp; exp, COI expirations) for the current view">⬇ Export for State Inspector GCL Audit</button></div>`;
  document.getElementById('proj').addEventListener('change',render);
  document.getElementById('filt').addEventListener('change',render);
  document.getElementById('q').addEventListener('input',render);
  document.getElementById('syncbtn').addEventListener('click',doSync);
  document.getElementById('exportbtn').addEventListener('click',exportAudit);
  document.getElementById('foot').innerHTML="Source of truth: Billy (active projects &amp; contracts, per-coverage compliance incl. waivers). Coverages WC / UL-EL / CGL / Auto (+ Professional Liability where required). GCL &amp; W-9 tracked at the vendor/directory level; GCL required for subcontractors with a Procore commitment ≥ $100k and verified against Alabama GenConBd. W-9 tracked for all vendors (note only, does not block). On-Site and Pay are one verdict. Source file: SharePoint /sites/Resources/Compliance Dashboard/compliance_data.json.";
  render();
}
function render(){
  const proj=document.getElementById('proj').value, filt=document.getElementById('filt').value;
  const isGlobalView = proj==='GLOBAL', isMissingView = proj==='MISSING';
  let rows;
  if(proj==='ALL' || isMissingView) rows=ROWS;
  else if(isGlobalView){ const seen=new Set(); rows=ROWS.filter(r=>r.global_coi==='Yes').filter(r=>{ const k=r.vendor_id||r.vendor; if(seen.has(k))return false; seen.add(k); return true; }); }
  else rows=ROWS.filter(r=>r.project===proj);
  const covBad = r => ['wc_days','ulel_days','cgl_days','auto_days','prof_days'].some(k=>{const v=r[k]; return v==='missing'||(v!==''&&v!=='waived'&&!isNaN(Number(v))&&Number(v)<0);});
  const docsNeeded = r => r.w9_on_file==='No' || r.gcl_missing_billy==='Yes' || covBad(r);
  const c={ok:0,soon:0,bad:0,docs:0};
  rows.forEach(r=>{const s=r.status; if(s==='Compliant')c.ok++;else if(s==='Expiring Soon')c.soon++;else if(s==='Non-Compliant')c.bad++; if(docsNeeded(r))c.docs++;});
  const card=(cls,n,label,f)=>`<div class="card ${cls}" style="cursor:pointer" onclick="setFilter('${f}')" title="Click to filter"><div class="n">${n}</div><div class="l">${label}</div></div>`;
  const billyMiss = rows.filter(r=>r.w9_on_file==='No').length + rows.filter(r=>r.gcl_missing_billy==='Yes').length;
  document.getElementById('cards').innerHTML=
    card('total',rows.length,'Vendors','all')+
    card('ok',c.ok,'Compliant','compliant')+
    card('soon',c.soon,'Expiring Soon','soon')+
    card('bad',c.bad,'Non-Compliant','nc')+
    `<div class="card gap" style="cursor:pointer" onclick="setView('MISSING')" title="Documents to add to Billy from Procore / Alabama"><div class="n">${billyMiss}</div><div class="l">Billy Missing Docs</div></div>`;
  let view=rows;
  if(filt==='nc') view=rows.filter(r=>r.status==='Non-Compliant');
  else if(filt==='compliant') view=rows.filter(r=>r.status==='Compliant');
  else if(filt==='soon') view=rows.filter(r=>r.status==='Expiring Soon');
  else if(filt==='nogcl') view=rows.filter(r=>r.gcl_required==='Yes' && (r.gcl_days==='missing' || (r.gcl_days!==''&&r.gcl_days!=='waived'&&!isNaN(Number(r.gcl_days))&&Number(r.gcl_days)<0)));
  else if(filt==='now9') view=rows.filter(r=>r.w9_on_file==='No');
  else if(filt==='noins') view=rows.filter(r=>['wc_days','ulel_days','cgl_days','auto_days','prof_days'].some(k=>{const v=r[k]; return v==='missing'||(v!==''&&v!=='waived'&&!isNaN(Number(v))&&Number(v)<0);}));
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  if(q) view=view.filter(r=>(r.vendor||'').toLowerCase().includes(q));
  const typeLabel = r => (r.vendor_type==='Supplier' && r.site_type) ? ('Supplier ('+(r.site_type==='Third Party'?'3rd Party':r.site_type)+')') : (r.vendor_type||'');
  const noteHtml = n => (n||'').split('; ').map(seg=>{
    if(/verified on Alabama/i.test(seg)) return '<span style="color:#1a7f37">'+seg+'</span>';
    if(/upload|obtain|Missing|Expired|not on file|not in Billy|no Alabama match|not found|W-9 not/i.test(seg)) return '<span style="color:#b3261e">'+seg+'</span>';
    return seg;
  }).join(' &middot; ');
  function covChip(label,v,exp,extra){
    let cell;
    if(v==='n/a') cell='<span class="cpill muted">n/a</span>';
    else if(v==='waived') cell='<span class="cpill muted">waived</span>';
    else if(v==='missing'||v==='expired') cell='<span class="cpill r">expired/missing</span>';
    else if(v===''||v==null) cell='<span class="cpill muted">&mdash;</span>';
    else { const d=Number(v); if(isNaN(d)) cell='<span class="cpill muted">&mdash;</span>'; else if(d<0) cell='<span class="cpill r">expired/missing</span>'; else cell='<span class="cpill '+(d<=THRESHOLD?'y':'g')+'">'+d+'</span>'; }
    const dstr=(exp && v!=='waived' && v!=='n/a')?'<span class="mdate">'+exp+'</span>':'';
    return '<span class="mini"><span class="mlabel">'+label+(extra?(' '+extra):'')+'</span>'+cell+dstr+'</span>';
  }
  const okChip = v => '<span class="cpill '+(v==='Yes'?'g':'r')+'">'+v+'</span>';
  const reqItems = r => {
    const out=[];
    [['wc_days','Workers’ Compensation Insurance'],['ulel_days','Excess/Umbrella Liability Insurance'],['cgl_days','Commercial General Liability Insurance'],['auto_days','Commercial Automobile Insurance'],['prof_days','Professional Liability Insurance']].forEach(([k,label])=>{
      const v=r[k];
      if(v==='missing' || (v!==''&&v!=='waived'&&!isNaN(Number(v))&&Number(v)<0)) out.push(label);
    });
    if(r.gcl_required==='Yes'){ const g=r.gcl_days;
      if(g==='missing'||(g!==''&&g!=='waived'&&!isNaN(Number(g))&&Number(g)<0)) out.push('General Contractor’s License / Subcontractor’s License'); }
    if(r.w9_on_file==='No') out.push('W-9');
    return out;
  };
  const mailtoFor = r => {
    const items=reqItems(r); if(!items.length) return '';
    const isGlobal = r.global_coi==='Yes';
    const subject = isGlobal
      ? 'Global compliance documents needed — '+r.vendor
      : 'Compliance documents needed — '+r.project+' ('+(r.commitment||'')+')';
    const intro = isGlobal
      ? 'Our records indicate the following global compliance documents have expired or are missing. As a reminder, you carry ONE blanket/global COI that covers all Bailey Harris Construction projects:'
      : 'Our records indicate the following compliance documents are missing or expired for '+r.project+':';
    const uploadLine = '\n\nA secure upload link has been sent to you via our compliance system, Billy (compliance@baileyharris.com). You may upload directly there or reply to this email with the documents.';
    const faqs=[
      'Where to find the requirement: Attachment F of your subcontract.',
      ...(!isGlobal ? ['Sometimes we are looking for an updated W-9 or Contractor’s License. These are company compliance documents, which is a different request than a project-specific COI + endorsement.'] : []),
      'Even if the COI lists the correct limits, an endorsement may still be missing. Use the link sent from Billy for Insurance to see exactly what is missing and any notes from our reviewer.',
      'You can forward the link from Billy to your insurance agent and they can upload on your behalf.',
      'If a waiver is in place, a current waiver may not show on your account until after your documents have been reviewed.',
      'Additional Questions? Email tiffany.blackmon@baileyharris.com'
    ];
    const faqBlock='\n\nFAQs:\n'+faqs.map(f=>'  • '+f).join('\n');
    const body='Dear '+r.vendor+',\n\n'+intro+'\n\n'+items.map(i=>'  • '+i).join('\n')+'\n\nPlease note: copies of the actual policy endorsements are also required to confirm the coverage is in force. A Certificate of Insurance (COI) is informational only and does not by itself prove that coverage exists.'+uploadLine+'\n\nPlease send the updated documentation at your earliest convenience so we can keep your account current for on-site access and payment.'+faqBlock+'\n\nThank you,\nBailey-Harris Construction';
    return 'mailto:'+encodeURIComponent(r.vendor_email||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  };
  const vcard = (r, globalView) => {
    const cls = r.status==='Compliant'?'g':(r.status==='Expiring Soon'?'y':'r');
    const alTag = r.gcl_on_alabama==='Yes'?'<span class="cpill g" style="font-size:9px">✓AL</span>':'';
    const cov = [
      r.gcl_required==='Yes'?covChip('GCL',r.gcl_days,(r.gcl_exp_alabama||r.gcl_exp_billy||''),alTag):covChip('GCL','n/a',''),
      covChip('WC',r.wc_days,r.wc_exp), covChip('UL/EL',r.ulel_days,r.ulel_exp), covChip('GL',r.cgl_days,r.cgl_exp), covChip('Auto',r.auto_days,r.auto_exp),
      r.prof_required==='Yes'?covChip('Prof',r.prof_days,r.prof_exp):covChip('Prof','n/a',''),
      '<span class="mini"><span class="mlabel">W-9</span>'+okChip(r.w9_on_file)+'</span>'
    ].join('');
    return '<div class="vcard '+cls+'">'
      +'<div class="vhead">'+((()=>{ const vl=billyVendorLink(r); const nm=(r.vendor||''); return vl?'<a class="vname vlink" href="'+vl+'" target="_blank" rel="noopener" title="Open in Billy">'+nm+'</a>':'<span class="vname">'+nm+'</span>'; })())+'<span class="vtype">'+typeLabel(r)+'</span>'
      +(r.global_coi==='Yes'?'<span class="gtag" title="Global blanket COI: one COI on the company directory; project COI waived">Global COI</span>':'')
      +'<span class="vright">On-Site/Pay '+okChip(r.on_site_ok)+' '+stPill(r.status)+'</span></div>'
      +'<div class="vsub">'+(globalView ? 'Company directory &middot; Global blanket COI (applies to all projects)' : ((r.project||'')+' &middot; '+(r.project_number||'')+' &middot; '+(r.commitment||'')+' &middot; $'+Number(r.contract_value||0).toLocaleString()))+'</div>'
      +'<div class="vcov">'+cov+'</div>'
      +(r.notes?'<div class="vnotes">'+noteHtml(r.notes)+'</div>':'')
      +((()=>{
        const h=mailtoFor(r);
        const gclGap = (r.gcl_required==='Yes' && (r.gcl_days==='missing' || (r.gcl_days!==''&&r.gcl_days!=='waived'&&!isNaN(Number(r.gcl_days))&&Number(r.gcl_days)<0))) || r.gcl_missing_billy==='Yes';
        const docGap = r.w9_on_file==='No' || gclGap;   // W-9 / GC License missing
        const insGap = covBad(r);                        // an actual insurance coverage is expired/missing
        if(!h && !docGap && !insGap) return '';
        let inner='';
        if(h){ const lbl=r.global_coi==='Yes'?'Request global docs':'Request updates';
          const lr=effLastReq(r);
          const daysSince = lr ? Math.floor((Date.now()-new Date(lr).getTime())/86400000) : null;
          const recent = daysSince!==null && daysSince<14;   // requested within the last 14 days -> disable
          const when = (()=>{ if(!lr) return 'not requested yet'; const d=new Date(lr); const n=new Date(); return (d.toDateString()===n.toDateString()) ? 'Documents requested today' : ('last requested '+d.toLocaleDateString()); })();
          const dis = recent ? ' disabled title="Requested '+daysSince+' day'+(daysSince===1?'':'s')+' ago — available again 14 days after the last request"' : '';
          inner += '<button class="reqbtn"'+dis+' data-mailto="'+encodeURIComponent(h)+'" data-vid="'+(r.vendor_id||'')+'" data-cid="'+(r.billy_contract_id||'')+'" data-global="'+(r.global_coi==='Yes'?1:0)+'">&#9993; '+lbl+'</button><span class="reqwhen">'+when+'</span>';
        }
        const upV=billyVendorDocs(r), upI=billyInsuranceDocs(r);
        if(docGap && upV) inner += '<a class="upbtn" href="'+upV+'" target="_blank" rel="noopener" title="Opens Billy at this vendor’s directory Documents tab — drag & drop the file there">&#8673; Upload W-9 / GC License</a>';
        if(insGap && upI) inner += '<a class="upbtn" href="'+upI+'" target="_blank" rel="noopener" title="Opens Billy at the '+(r.global_coi==='Yes'?'company directory':'project contract')+' Documents tab — drag & drop the file there">&#8673; Upload insurance docs</a>';
        return '<div class="vact">'+inner+'</div>';
      })())
      +'</div>';
  };
  let listHtml;
  if(!view.length){ listHtml='<div class="empty">No vendors match this view.</div>'; }
  else if(proj==='ALL'){
    // group by project (a vendor can appear under multiple jobs)
    const groups={}; view.forEach(r=>{ const k=r.project||'(no project)'; (groups[k]=groups[k]||[]).push(r); });
    listHtml=Object.keys(groups).sort().map(pn=>{
      const g=groups[pn]; const num=g[0].project_number?(' &middot; '+g[0].project_number):'';
      return '<div class="projgrp">'+pn+'<span class="cnt">'+num+' &middot; '+g.length+' vendor'+(g.length===1?'':'s')+'</span></div>'+g.map(r=>vcard(r,false)).join('');
    }).join('');
  } else {
    listHtml=view.map(r=>vcard(r, isGlobalView)).join('');
  }
  document.getElementById('list').innerHTML = listHtml;
  document.querySelectorAll('.reqbtn:not([disabled])').forEach(b=>b.onclick=()=>onRequestDocs(b));
  // Data validation — items to add to Billy
  const w9miss = rows.filter(r=>r.w9_on_file==='No');
  const gclmiss = rows.filter(r=>r.gcl_missing_billy==='Yes');
  const li = arr => arr.map(r=>`<li><b>${r.vendor}</b> <span class="nc-proj">— ${r.project} (${r.project_number||''})</span></li>`).join('');
  const gclli = gclmiss.map(r=>`<li><b>${r.vendor}</b> <span class="nc-proj">— ${r.project} (${r.project_number||''})</span> · ${r.gcl_on_alabama==='Yes'?('on Alabama, exp '+(r.gcl_exp_alabama||'?')+' → <b>upload to Billy</b>'):'<b>not found on Alabama → obtain license + upload</b>'}</li>`).join('');
  document.getElementById('valid').innerHTML=
    `<div class="gap-card"><h4>W-9 missing in Billy <span class="nc-proj">(${w9miss.length}) — add from Procore</span></h4>`+
    (w9miss.length?`<ul class="rsn">${li(w9miss)}</ul>`:`<div class="empty">None in view. ✅</div>`)+`</div>`+
    `<div class="gap-card"><h4>GCL not on file in Billy <span class="nc-proj">(${gclmiss.length}) — upload from Alabama/website</span></h4>`+
    (gclmiss.length?`<ul class="rsn">${gclli}</ul>`:`<div class="empty">None in view. ✅</div>`)+`</div>`;
  // "Billy Missing Docs" is its own view — show only that section; hide vendor UI. Otherwise reverse.
  const sh=(id,on)=>{ const el=document.getElementById(id); if(el) el.style.display = on?'':'none'; };
  const leg=document.querySelector('.legend'); if(leg) leg.style.display = isMissingView?'none':'';
  sh('cards',!isMissingView); sh('filtwrap',!isMissingView); sh('qwrap',!isMissingView);
  sh('vendors-title',!isMissingView); sh('list',!isMissingView);
  sh('valid-title',isMissingView); sh('valid',isMissingView);
}
window.setView = function(v){ const el=document.getElementById('proj'); if(el){ el.value=v; render(); el.scrollIntoView({behavior:'smooth',block:'nearest'}); } };
function exportAudit(){
  const proj=document.getElementById('proj').value;
  // scope by the current View (project or all); audits want the full sub list, so ignore Filter/Search
  let scope;
  if(proj==='ALL'||proj==='MISSING') scope=ROWS;
  else if(proj==='GLOBAL'){ const seen=new Set(); scope=ROWS.filter(r=>r.global_coi==='Yes').filter(r=>{const k=r.vendor_id||r.vendor; if(seen.has(k))return false; seen.add(k); return true;}); }
  else scope=ROWS.filter(r=>r.project===proj);
  const subs=scope.filter(r=>r.vendor_type!=='Supplier');   // suppliers don't count
  subs.sort((a,b)=>(a.project||'').localeCompare(b.project||'')||(a.vendor||'').localeCompare(b.vendor||''));
  const singleProj = !(proj==='ALL'||proj==='GLOBAL'||proj==='MISSING');
  // State GCL audit column layout (matches Alabama Licensing Board template) + GC License Exp.
  const cols=['Company Name','Address','City','State','Zip','Business Phone','Email','Trade/Specialty','GCL No.','GCL Exp. Date','Contract Division','Original Contract Amount','Start Date','End Date'];
  const AMT=11;  // currency column index
  const dataRows=subs.map(r=>[
    r.vendor||'', r.al_address||'', r.al_city||'', r.al_state||'', r.al_zip||'', r.al_phone||'', r.vendor_email||'',
    r.al_specialty||'', r.al_license||'', r.gcl_exp_alabama||r.gcl_exp_billy||'', r.contract_division||'',
    (r.contract_value!==''&&r.contract_value!=null)?Number(r.contract_value):null,
    r.contract_start||'', r.contract_end||''
  ]);
  // optional project header block (only when a single project is in view)
  const pre=[];
  if(singleProj){ const f=subs[0]||{};
    pre.push(['Project Name:', f.project||proj]);
    pre.push(['Project #:', f.project_number||'']);
    pre.push(['Project Address:', f.project_address||'']);
    pre.push(['Owner Name:', f.project_owner||'']);
    pre.push(['Valuation:', (f.project_valuation!==''&&f.project_valuation!=null)?Number(f.project_valuation):'']);
    pre.push([]);
  }
  const aoa=pre.concat([cols], dataRows);
  const hdrRow=pre.length, dataStart=pre.length+1;
  const tag=singleProj?proj.replace(/[^A-Za-z0-9]+/g,'_'):'All-Projects';
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());

  if(typeof XLSX!=='undefined'){
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    for(let i=dataStart;i<aoa.length;i++){ const ref=XLSX.utils.encode_cell({r:i,c:AMT}); const cell=ws[ref]; if(cell && typeof cell.v==='number'){ cell.t='n'; cell.z='$#,##0.00'; } }
    ws['!cols']=[{wch:32},{wch:26},{wch:16},{wch:6},{wch:8},{wch:16},{wch:26},{wch:22},{wch:12},{wch:13},{wch:22},{wch:18},{wch:12},{wch:12}];
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:hdrRow,c:0},e:{r:aoa.length-1,c:cols.length-1}})};
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'GCL Audit');
    XLSX.writeFile(wb,'State_GCL_Audit_'+tag+'_'+stamp+'.xlsx');
    return;
  }
  // fallback: CSV if the xlsx library didn't load
  const cell=v=>{ const s=(v===null||v===undefined)?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv=aoa.map(row=>row.map(cell).join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='State_GCL_Audit_'+tag+'_'+stamp+'.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
window.setFilter = function(v){ const el=document.getElementById('filt'); if(el){ el.value=v; render(); el.scrollIntoView({behavior:'smooth',block:'nearest'}); } };
async function loadLastReqMap(token){
  if(!SYNC_WORKER_URL) return;
  try{
    const r=await fetch(SYNC_WORKER_URL,{ method:'POST', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:JSON.stringify({ action:'lr_get' }) });
    const j=await r.json(); if(j&&j.map) LR_MAP=j.map;
  }catch(e){ /* fall back to per-browser localStorage */ }
}
async function onRequestDocs(btn){
  const mailto=decodeURIComponent(btn.dataset.mailto||'');
  const vid=btn.dataset.vid, cid=btn.dataset.cid, isGlobal=btn.dataset.global==='1';
  if(SYNC_WORKER_URL && (vid||cid)){
    const orig=btn.textContent; btn.disabled=true; btn.textContent='Sending link…';
    try{
      const acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
      const t=await msalApp.acquireTokenSilent({ scopes:SCOPES, account:acct });
      await fetch(SYNC_WORKER_URL,{ method:'POST', headers:{ Authorization:'Bearer '+t.accessToken, 'Content-Type':'application/json' },
        body:JSON.stringify({ action:'request', vendor_id:vid?Number(vid):undefined, contract_id:cid?Number(cid):undefined, global:isGlobal }) });
      // remember the moment (Billy doesn't expose company-level request time on GET /vendors)
      const nowIso=new Date().toISOString(); const lk=isGlobal ? ('v:'+vid) : ('c:'+cid);
      setLocalLastReq(lk, nowIso); LR_MAP[lk]=nowIso;   // local + shared-map (Worker also persisted it to KV)
      render();
    }catch(e){ /* still open the email draft */ }
    btn.disabled=false; btn.textContent=orig;
  }
  if(mailto) window.location.href=mailto;
}
async function doSync(){
  const b=document.getElementById('syncbtn');
  if(!SYNC_WORKER_URL){ alert('Sync isn’t configured yet. The data still refreshes automatically on a schedule.'); return; }
  b.disabled=true; const orig=b.textContent; b.textContent='Syncing…';
  try{
    const acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
    const t=await msalApp.acquireTokenSilent({ scopes:SCOPES, account:acct });
    const r=await fetch(SYNC_WORKER_URL,{ method:'POST', headers:{ Authorization:'Bearer '+t.accessToken } });
    if(!r.ok) throw new Error((await r.text())||('HTTP '+r.status));
    b.textContent='Syncing… auto-refresh in ~90s';
    setTimeout(()=>location.reload(), 95000);
  }catch(e){ b.disabled=false; b.textContent=orig; alert('Sync failed: '+(e&&e.message||e)); }
}
