<title>Compliance Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Montserrat', Arial, Helvetica, sans-serif; background:#f5f7fa; color:#211E1E; }
  .wrap { max-width:1300px; margin:0 auto; padding:20px; }
.bh-banner{background:#fff;border-bottom:1px solid #E8E6E7;width:100%}
  .bh-banner-inner{max-width:1300px;margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:18px}
  .bh-badge{margin-left:auto;border:1px solid #1a7f37;color:#1a7f37;background:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:.05em;white-space:nowrap}
  .bh-logo{height:54px;width:auto;flex:none}
  .bh-titles{line-height:1.2}
  .bh-title{color:#211E1E;font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .bh-sub{color:#5b6472;font-size:12.5px;margin-top:3px}
  h1{font-size:22px;margin:0 0 2px;color:#7F1B29}
  .sub { color:#5b6472; font-size:13px; margin-bottom:14px; }
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .controls label { font-size:13px; color:#40485a; font-weight:bold; }
  select { padding:8px 12px; border:1px solid #c7cfdb; border-radius:8px; font-size:14px; background:#fff; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid #e3e8f0; border-radius:10px; padding:13px 15px; }
  .card .n { font-size:25px; font-weight:bold; } .card .l { font-size:11.5px; color:#5b6472; margin-top:2px; text-transform:uppercase; letter-spacing:.03em; }
  .total .n{color:#7F1B29} .ok .n{color:#1a7f37} .soon .n{color:#9a6a00} .bad .n{color:#b3261e} .gap .n{color:#1a4fb0}
  .section-title { font-size:15px; font-weight:bold; color:#7F1B29; margin:22px 0 10px; }
  .tablescroll { overflow-x:auto; border-radius:10px; }
  .scrolltop { overflow-x:auto; overflow-y:hidden; }
  .scrolltop > div { height:1px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04); font-size:12px; }
  th,td { padding:7px 8px; text-align:center; border-bottom:1px solid #eef1f6; white-space:nowrap; }
  th { background:#484B4D; color:#fff; font-size:11px; position:sticky; top:0; }
  td.l, th.l { text-align:left; }
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold}
  .g{background:#C6EFCE;color:#006100}.y{background:#FFEB9C;color:#9C6500}.r{background:#FFC7CE;color:#9C0006}.b{background:#DDEBF7;color:#1F3864}.muted{color:#9aa2b1}
  .nc-card{background:#fff;border:1px solid #f0c2c2;border-left:4px solid #b3261e;border-radius:8px;padding:11px 13px;margin-bottom:9px}
  .gap-card{background:#fff;border:1px solid #b7ccf5;border-left:4px solid #1a4fb0;border-radius:8px;padding:11px 13px;margin-bottom:9px}
  .nc-card h4,.gap-card h4{margin:0 0 3px;font-size:13.5px}
  .nc-proj{font-size:12px;color:#5b6472;font-weight:normal}
  .rsn{margin:5px 0 0;padding-left:16px;font-size:12px;color:#7a1d16}
  .gap-card .rsn{color:#1a3a7a}
  .flags{font-size:11px;color:#5b6472;margin-top:3px}
  .empty{color:#5b6472;font-style:italic;padding:10px 0}
  .loading{padding:40px;text-align:center;color:#5b6472}
  .legend{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:12.5px;line-height:2;color:#40485a}
  .legend b{color:#7F1B29}
  .legend .pill{margin:0 2px}
  .legend .grp{display:inline-block;margin-right:18px;white-space:nowrap}
  .vcard{background:#fff;border:1px solid #e3e8f0;border-left:6px solid #1a4fb0;border-radius:10px;padding:11px 15px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .vcard.g{border-left-color:#1a7f37}.vcard.y{border-left-color:#c99a00}.vcard.r{border-left-color:#b3261e}
  .vprojs{margin:5px 0 2px;font-size:11px;color:#484B4D;line-height:1.9}
  .vprojs .lbl{color:#7a828f;margin-right:4px}
  .pchip{display:inline-block;background:#eef3fb;border:1px solid #c3d4ee;color:#1F3864;border-radius:10px;padding:1px 8px;margin:0 4px 3px 0;white-space:nowrap}
  .pchip.w{background:#FFF7E9;border-color:#f0cf8e;color:#8a5a00}
  .pchip .pn{font-weight:700;margin-right:4px}
  .vsig{margin:6px 0 2px;font-size:11px;padding:4px 9px;border-radius:8px;background:#FFF7E9;border:1px solid #f0cf8e;color:#8a5a00}
  .vsig.sub{background:#eef3fb;border-color:#c3d4ee;color:#1F3864}
  .vsig.done{background:#f0faf3;border-color:#b7e0c2;color:#1a7f37}
  .vsig b{font-weight:700}
  .vhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .vname{font-weight:bold;font-size:14.5px;color:#211E1E}
  a.vlink{text-decoration:none}a.vlink:hover{color:#ED2B30;text-decoration:underline}
  .vtype{font-size:12px;color:#5b6472}
  .gtag{background:#DDEBF7;color:#1F3864;border:1px solid #b7ccf5;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:bold}
  .wtag{background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:bold}
  .itag{background:#e9ecf1;color:#6b7480;border:1px solid #cfd6e0;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:bold}
  .vright{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:#8a92a1}
  .vsub{font-size:11.5px;color:#8a92a1;margin-top:2px}
  .vcov{margin-top:8px;display:grid;grid-template-columns:repeat(7,minmax(72px,1fr));gap:9px 10px;align-items:start}
  .mini{font-size:11px;color:#40485a;display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:nowrap}
  .mlabel{color:#7a828f;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em}
  .mdate{color:#8a92a1;font-size:10px}
  .cpill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:bold}
  .cpill.g{background:#C6EFCE;color:#006100}.cpill.y{background:#FFEB9C;color:#9C6500}.cpill.r{background:#FFC7CE;color:#9C0006}.cpill.muted{background:#eef1f6;color:#8a92a1}
  .vnotes{margin-top:7px;font-size:11.5px;line-height:1.55;color:#40485a;border-top:1px solid #f0f2f6;padding-top:6px}
  .vact{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .reqwhen{font-size:11px;font-style:italic;color:#8a92a1}
  .projgrp{margin:18px 0 8px;padding:6px 10px;background:#eef2f8;border-left:4px solid #484B4D;border-radius:4px;font-weight:bold;font-size:13.5px;color:#211E1E;display:flex;align-items:center;gap:8px}
  .projgrp:first-child{margin-top:0}
  .projgrp .cnt{font-weight:normal;font-size:11.5px;color:#6b7480}
  .exportbar{margin:22px 0 8px;text-align:right;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  #exportbtn{padding:10px 20px;border:1px solid #211E1E;background:#211E1E;color:#fff;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
  #exportbtn:hover{background:#484B4D}
  .recbtn{padding:10px 20px;border:1px solid #211E1E;background:#211E1E;color:#fff;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
  .recbtn:hover{background:#484B4D}
  .projpick{position:relative;display:inline-block;vertical-align:middle}
  .proj-btn{padding:8px 26px 8px 12px;border:1px solid #c7cfdb;border-radius:8px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%235b6472'/></svg>") no-repeat right 10px center;font-size:13px;cursor:pointer;min-width:150px;max-width:230px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj-btn:hover{border-color:#9fb0c7}
  .proj-panel{display:none;position:absolute;z-index:60;top:calc(100% + 4px);left:0;width:240px;background:#fff;border:1px solid #c7cfdb;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);overflow:hidden}
  .proj-panel.open{display:block}
  #projsearch{width:100%;box-sizing:border-box;padding:7px 10px;border:none;border-bottom:1px solid #eef1f6;font-size:13px}
  .projlist-actions{font-size:11px;padding:5px 9px;background:#f7f9fc;border-bottom:1px solid #eef1f6}
  .projlist-actions a{color:#ED2B30;text-decoration:none}
  .projlist{max-height:240px;overflow-y:auto;background:#fff}
  .projopt{display:block;padding:5px 10px;font-size:12.5px;font-weight:normal;cursor:pointer;white-space:nowrap}
  .projopt:hover{background:#eef2f8}
  .projopt input{margin-right:6px;vertical-align:middle}
  .tabbar{display:flex;gap:4px;border-bottom:2px solid #d7deea;margin-bottom:16px}
  .tab{padding:10px 22px;border:none;background:transparent;color:#5b6472;font-size:14px;font-weight:bold;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab:hover{color:#211E1E}
  .tab.active{color:#211E1E;border-bottom-color:#ED2B30;background:#F2ECE1;border-radius:6px 6px 0 0}
  .subnav{display:flex;gap:8px;margin-bottom:14px}
  .subtab{padding:6px 14px;border:1px solid #c7cfdb;background:#fff;color:#5b6472;border-radius:999px;font-size:12.5px;font-weight:bold;cursor:pointer}
  .subtab.active{background:#211E1E;border-color:#211E1E;color:#fff}
  .lookup-help{font-size:12.5px;color:#5b6472;margin-bottom:8px}
  #lookupInput{width:100%;padding:10px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical}
  .lookup-actions{margin:10px 0;display:flex;gap:10px;flex-wrap:wrap}
  #lookupBtn{padding:9px 18px;border:1px solid #211E1E;background:#211E1E;color:#fff;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer}
  #lookupExport{padding:9px 18px;border:1px solid #211E1E;background:#211E1E;color:#fff;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer}
  #lookupExport:hover{background:#484B4D}
  .lktable{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .lktable th{background:#484B4D;color:#fff;padding:7px 8px;text-align:left;font-size:11px;white-space:nowrap}
  .lktable td{padding:6px 8px;border-bottom:1px solid #eef1f6;white-space:nowrap}
  .lktable tr.notfound td{background:#FFF3F3;color:#9C0006}
  .lktable tr.warn td{background:#FFF9E9}
  .lkmini{font-size:11px;color:#8a92a1}
  .reqbtn{display:inline-block;padding:6px 12px;border:1px solid #484B4D;color:#484B4D;background:#fff;border-radius:8px;font-size:12px;font-weight:bold;text-decoration:none}
  .reqbtn:hover{background:#484B4D;color:#fff}

const BILLY_TEAM = 'bailey-harris-construction-co-inc';
const BILLY_DOCS_BASE = 'https://app.billyforinsurance.com/teams/' + BILLY_TEAM;
function billyVendorDocs(r){ return r.vendor_id ? (BILLY_DOCS_BASE+'/directory/vendors/'+r.vendor_id+'/Documents') : ''; }
function billyInsuranceDocs(r){
  if(r.global_coi==='Yes') return billyVendorDocs(r);                                   // global blanket COI -> company directory
  if(r.billy_project_id && r.billy_contract_id)                                          // project-specific (subs AND POs use /subcontract/)
    return BILLY_DOCS_BASE+'/projects/'+r.billy_project_id+'/subcontract/'+r.billy_contract_id+'/Documents';
  return billyVendorDocs(r);                                                             // missing ids -> safe fallback (company directory)
}
function billyVendorLink(r){                                                             // vendor name -> Billy record
  if(r.global_coi!=='Yes' && r.billy_project_id && r.billy_contract_id)
    return BILLY_DOCS_BASE+'/projects/'+r.billy_project_id+'/subcontract/'+r.billy_contract_id+'/Coverages';   // project-specific -> project vendor Coverages
  return r.vendor_id ? (BILLY_DOCS_BASE+'/directory/vendors/'+r.vendor_id+'/Details') : '';                     // global / fallback -> directory Details
}
// Billy stores last_requested only on CONTRACTS; company-level (global) requests
// aren't readable from GET /vendors. So we remember the moment a request was sent
// from this dashboard (per browser) and merge it with the pulled contract value.
function reqKey(r){ return (r.global_coi==='Yes') ? ('v:'+(r.vendor_id||'')) : ('c:'+(r.billy_contract_id||'')); }
function localLastReq(k){ try{ return localStorage.getItem('bh_lr_'+k)||''; }catch(e){ return ''; } }
function setLocalLastReq(k,iso){ try{ localStorage.setItem('bh_lr_'+k, iso); }catch(e){} }
let ACTIVE_TAB='ops';  // ops | global | cmgr | acct
let CMGR_SUB='vendors';  // Compliance Manager sub-view: queue | vendors | docs
let STATE=null;          // compliance_state.json - per-row stall clock written by compliance_pull.js
let RQ=null;             // review_queue.json - documents uploaded to Billy but not yet reviewed
let SQ=null;             // signature_queue.json - DocuSign envelopes waiting on her signature
let UNTRACKED=[];        // Procore commitments with no Billy contract behind them
let BILLY_INACTIVE=[];   // ...that DO have a Billy contract, closed as inactive
let SELF_PERFORM=[];     // ...that are our own divisions
let LR_MAP={};  // shared last-requested map from the Worker (KV), keyed like reqKey()
function effLastReq(r){ const k=reqKey(r); return [r.last_requested||'', localLastReq(k), LR_MAP[k]||''].sort().slice(-1)[0]; }  // newest wins (ISO sorts chronologically)
let ROWS = [], GENERATED = '';
const msalApp = new msal.PublicClientApplication({
  auth: { clientId: MSAL_CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT,
          redirectUri: window.location.origin + window.location.pathname },
  cache: { cacheLocation: 'sessionStorage' }
});
async function getToken(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  let account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { const t = await msalApp.acquireTokenSilent({ scopes: SCOPES, account }); return t.accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}

function dcell(v){
  if(v==='waived') return '<td><span class="muted">waived</span></td>';
  if(v==='missing'||v==='expired') return '<td><span class="pill r">&lt;0</span></td>';  // expired / no current coverage
  if(v===null||v===undefined||v==='') return '<td><span class="muted">n/a</span></td>';  // not required
  const d=Number(v); if(isNaN(d)) return '<td><span class="muted">n/a</span></td>';
  if(d<0) return '<td><span class="pill r">&lt;0</span></td>';
  const c=d<=THRESHOLD?'y':'g';
  return `<td><span class="pill ${c}">${d}</span></td>`;
}
const stPill=s=>`<span class="pill ${s==='Compliant'?'g':s==='Expiring Soon'?'y':s==='Data Gap'?'b':'r'}">${s}</span>`;
const okPill=v=>`<span class="pill ${v==='Yes'?'g':v==='Verify'?'y':'r'}">${v}</span>`;

async function load(){
  try{
    const token = await getToken();
    if(!token) return; // redirecting to Microsoft sign-in
    const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/content`, { headers: { Authorization: 'Bearer ' + token } });
    if(!res.ok) throw new Error('Graph HTTP '+res.status+' (need SharePoint access to the file)');
    const data = await res.json();
    if (!data || !Array.isArray(data.rows)) throw new Error('Unexpected data shape');
    ROWS = data.rows; GENERATED = data.generated_at || ''; UNTRACKED = data.untracked || [];
    BILLY_INACTIVE = data.billy_inactive || []; SELF_PERFORM = data.self_perform || [];
    document.getElementById('asof').textContent = GENERATED ? ('data as of ' + new Date(GENERATED).toLocaleString()) : '';
    await loadLastReqMap(token);   // shared "last requested" (company-level not readable from Billy's API)
    /* Stall clock. compliance_data.json says what is wrong today; it cannot say how long
       it has been wrong. compliance_pull.js writes compliance_state.json beside it with,
       per row, a digest of the fields that count as movement and the timestamp that state
       was first seen. Best-effort: the queue shows an empty state if it is not there yet. */
    try{
      const sr=await fetch('https://graph.microsoft.com/v1.0/drives/'+DRIVE_ID+'/root:/'+encodeURI('Compliance Dashboard/compliance_state.json')+':/content',{headers:{Authorization:'Bearer '+token}});
      if(sr.ok) STATE=await sr.json();
    }catch(e){ STATE=null; }
    /* Billy has no needs_review endpoint - billy_review_pull.js reconstructs the queue
       from documents that carry no reviewed_on date, at both the contract (project) and
       vendor (directory) level, and writes it here. */
    try{
      const rr=await fetch('https://graph.microsoft.com/v1.0/drives/'+DRIVE_ID+'/root:/'+encodeURI('Compliance Dashboard/review_queue.json')+':/content',{headers:{Authorization:'Bearer '+token}});
      if(rr.ok) RQ=await rr.json();
    }catch(e){ RQ=null; }
    try{
      const sq=await fetch('https://graph.microsoft.com/v1.0/drives/'+DRIVE_ID+'/root:/'+encodeURI('Compliance Dashboard/signature_queue.json')+':/content',{headers:{Authorization:'Bearer '+token}});
      if(sq.ok) SQ=await sq.json();
    }catch(e){ SQ=null; }
    buildUI();
  }catch(e){
    const b=document.getElementById('banner'); b.style.display='block'; b.className='banner err';
    b.textContent='Sign-in or data load failed: '+(e&&e.message||e);
    document.getElementById('content').innerHTML='';
  }
}

}
function render(){
  if(ACTIVE_TAB==='acct') return;
  const filt=document.getElementById('filt').value;
  const scope=currentScope();
  const rows=scope.rows, isGlobalView=scope.isGlobalView;
  const covKeys = r => { if((r.project_status||'').toLowerCase()!=='warranty') return ['wc_days','ulel_days','cgl_days','auto_days','prof_days']; return r.vendor_type==='Professional'?['cgl_days','prof_days']:['cgl_days']; };
  const covBad = r => covKeys(r).some(k=>{const v=r[k]; return v==='missing'||v==='expired'||(v!==''&&v!=='waived'&&!isNaN(Number(v))&&Number(v)<0);});
  const docsNeeded = r => r.w9_on_file==='No' || r.gcl_missing_billy==='Yes' || covBad(r);
  const c={ok:0,soon:0,bad:0,docs:0};
  rows.forEach(r=>{const s=r.status; if(s==='Compliant')c.ok++;else if(s==='Expiring Soon')c.soon++;else if(s==='Non-Compliant')c.bad++; if(docsNeeded(r))c.docs++;});
  /* Procore is authoritative on WHETHER a commitment is out for signature or executed —
     it is keyed to the commitment and needs no matching. DocuSign adds only the part
     Procore does not have: whose turn it is. So the state comes from Procore and the
     names come from DocuSign when an envelope can be tied to the same commitment. */
  /* A change order is NOT the contract. It carries the commitment number it amends, so
     it matches a commitment by number and would otherwise render on the vendor's card as
     though the subcontract itself were out for signature. This dashboard is a commitment
     view: change orders are excluded here and belong on a change-management dashboard.
     doc_type comes from the pull; the subject test is a backstop for anything it missed. */
  const CO_SUBJ = /change\s*(order|event)|\b(pco|ico|cco|cor|oco)\s*#?\s*\d|\bc\.\s*o\.\s*#?\s*\d|\bco\s*#\s*\d|\bco\s*(?:no\.?|number)\s*\d|\bce\s*#?\s*\d/i, CO_CAPS = /\bCO\s*#?\s*\d{1,3}\b(?!\d)/;
  const isCO = x => /change\s*order/i.test(x.doc_type||'')
    || CO_SUBJ.test(x.subject||'') || CO_CAPS.test(x.subject||'');
  const procoreOut = r => /out for signature/i.test(r.commitment_status||'');
  const procoreExecDate = r => String(r.commitment_execution_date||'').trim();
  const isOutForSig = r => !(r.commitment_executed==='Yes' || String(r.commitment_execution_date||'').trim())
                            && (procoreOut(r) || !!sigFor(r));
  /* The envelope out for signature against THIS commitment, if there is one.
     Matched on the commitment number only — the compliance dashboard is a commitment
     view, so an envelope that cannot be tied to an open commitment (a change order, or
     a subject line with no number) has no business appearing on a vendor's card. Those
     are a change-management problem for a later dashboard. */
  const vKey = v => String(v||'').toLowerCase().replace(/[.,'&]/g,'').replace(/\b(llc|inc|co|corp|company|ltd|lp|llp)\b/g,'').replace(/\s+/g,' ').trim();
  const sigFor = r => {
    if(!SQ || !Array.isArray(SQ.all)) return null;
    const live = SQ.all.filter(x=>x.with_side!=='nobody' && !isCO(x));
    const c=String(r.commitment||'').trim();
    if(c){
      const hit=live.find(x=>String(x.commitment||'').trim()===c);
      if(hit) return hit;
    }
    /* FALLBACK: the envelope names the vendor but not the commitment. Plenty of subject
       lines carry no number at all ("Final Cleaning - Nicole Lyles"), so the strict
       commitment match finds nothing and the card goes blank even though DocuSign knows
       exactly who is holding it.

       Loose matching is what attached a PSA to GL Pack and a change order to Southern
       Blocking, so this is gated hard rather than merely preferred. It fires ONLY when:
         - the vendor matches (ignoring LLC/Inc/punctuation), and
         - the envelope is on this same project, and
         - the envelope claims no commitment of its own, and
         - this vendor has exactly ONE commitment out for signature on this project, and
         - exactly ONE such envelope exists.
       With one envelope and one open commitment there is no second candidate to get
       wrong. Any ambiguity at all and it declines rather than guesses. */
    if(!procoreOut(r)) return null;
    /* TIER 3: the envelope subject IS the commitment title. Procore's send template uses
       the title verbatim, so "Final Cleaning" is a whole subject line with no vendor and
       no number in it - unmatchable by every earlier rule. Gated the same way: the title
       must identify exactly one commitment out for signature anywhere in the dataset, and
       exactly one unmatched envelope must carry it. A title as generic as "Final Cleaning"
       is only safe BECAUSE of that uniqueness test - two jobs buying final cleaning at the
       same moment makes it ambiguous, and then it declines. */
    const tKey = t => String(t||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
    const myTitle=tKey(r.commitment_title);
    if(myTitle){
      const sameTitle=(typeof ROWS!=='undefined'&&Array.isArray(ROWS)?ROWS:[])
        .filter(z=>tKey(z.commitment_title)===myTitle && procoreOut(z)
          && !(z.commitment_executed==='Yes'||String(z.commitment_execution_date||'').trim()));
      if(sameTitle.length===1 && String(sameTitle[0].commitment||'')===String(r.commitment||'')){
        const tc=live.filter(x=>!String(x.commitment||'').trim() && tKey(x.subject)===myTitle);
        if(tc.length===1) return Object.assign({},tc[0],{matched_by:'title'});
      }
    }
    const vk=vKey(r.vendor), pn=String(r.project_number||'').trim();
    if(!vk||!pn) return null;
    const mine=(typeof ROWS!=='undefined'&&Array.isArray(ROWS)?ROWS:[])
      .filter(z=>String(z.project_number||'').trim()===pn && vKey(z.vendor)===vk && procoreOut(z));
    if(mine.length!==1) return null;
    const cands=live.filter(x=>!String(x.commitment||'').trim()
      && vKey(x.vendor)===vk && String(x.project_number||'').trim()===pn);
    if(cands.length!==1) return null;
    return Object.assign({},cands[0],{matched_by:'vendor'});
  };
  /* Executed, and when. The counterpart to "out for signature": between them every
     commitment DocuSign knows about can say where it stands. In flight wins if both
     exist — a new envelope against a commitment supersedes an older execution. */
  const execFor = r => {
    if(!SQ || !Array.isArray(SQ.executed)) return null;
    const c=String(r.commitment||'').trim(); if(!c) return null;
    return SQ.executed.find(x=>!isCO(x) && String(x.commitment||'').trim()===c) || null;
  };
  const fmtDate = d => { if(!d) return ''; const t=new Date(d+'T00:00:00');
    return isNaN(t)?esc(d):t.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); };
  /* Precedence. Procore's STATUS is moved by hand — a PM who forgets to drag a
     commitment from "Out For Signature" to "Approved" leaves a stale label behind.
     `executed` is not hand-set: it can only become true after the commitment is
     approved, so it is the reliable signal and it outranks the status. Where the two
     disagree, the contract is executed and the status is what needs fixing. */
  const isExecuted = r => r.commitment_executed==='Yes' || !!procoreExecDate(r);
  const stalePill = src => ' <span class="pill y" title="'+src+' but the Procore status is still Out For Signature — move it to Approved">status not updated</span>';
  const staleFlag = r => (isExecuted(r) && procoreOut(r)) ? stalePill('Executed in Procore') : '';

    const x=sigFor(r);

       still showing as open, because `executed` cannot be set before the commitment is
       approved. An open envelope against an executed commitment is noted, not obeyed. */
    const pd=procoreExecDate(r);
    if(pd || r.commitment_executed==='Yes'){
      const still = x ? ' <span class="pill y" title="An envelope is still open in DocuSign against this commitment, which is executed — likely a change order or a re-send. Envelope: '+esc(x.subject||'(no subject)')+'">envelope still open</span>' : '';
      /* Procore knows THAT it was executed but often not WHEN - the date field is filled in
         by hand and usually is not. DocuSign knows exactly when the last signature landed,
         and that envelope is already in the file we fetched, so the date is free: no extra
         call, nothing added to the sync. Procore still decides whether it is executed;
         DocuSign only supplies the date, and the label says which system each part is from. */
      const de = pd ? null : execFor(r);
      /* The date is the useful part; WHICH system it came from is not worth the width.
         Provenance moves to the tooltip. The only case that still needs words on screen
         is having no date at all, where silence would read as "not executed yet". */
      const when = pd ? ('&mdash; '+fmtDate(pd))
        : (de && de.completed_at)
          ? ('&mdash; '+fmtDate(de.completed_at)
             +' <a href="'+esc(de.url||'#')+'" target="_blank" rel="noopener">open</a>')
          : ' <span class="muted">(no execution date in either system)</span>';
      const src = pd ? 'Execution date from Procore'
        : (de && de.completed_at) ? ('Signed in DocuSign '+fmtDate(de.completed_at)
            +' — Procore recorded no execution date. Envelope: '+(de.subject||'(no subject)'))
        : 'Procore says this commitment is executed but neither system holds a date';
      return '<div class="vsig done" title="'+esc(src)+'">&#10003; <b>Executed</b> '+when+staleFlag(r)+still+'</div>';
    }
    /* 1b. Procore's own signature record. It names the holder and is keyed to the
       commitment by Procore itself, so it beats any envelope we matched from a subject
       line - that matching is what attached a change order to Southern Blocking and a
       PSA to the wrong job. Days are measured from when Procore sent it. */
    if(r.esig_ball_in_court){
      const sent=String(r.esig_sent_date||'');
      const d=sent?Math.floor((Date.now()-Date.parse(sent+'T00:00:00'))/86400000):null;
      const link=r.esig_url?(' <a href="'+esc(r.esig_url)+'" target="_blank" rel="noopener">open</a>'):'';
      return '<div class="vsig" title="Named by Procore on the commitment'
        +(r.esig_synced_date?(' - last synced with DocuSign '+fmtDate(r.esig_synced_date)):'')+'">'
        +'&#9998; <b>Out for signature</b> &mdash; with '+esc(r.esig_ball_in_court)
        +(d!=null?(' &middot; '+d+' day'+(d===1?'':'s')):'')+link+'</div>';
    }
    if(!x){
      // 2. A completed DocuSign envelope, where Procore has not recorded execution.
      const e=execFor(r);
      if(e) return '<div class="vsig done" title="'+esc(e.subject||'')+'">'
        +'&#10003; <b>Executed via DocuSign</b>'+(e.completed_at?(' &mdash; '+fmtDate(e.completed_at)):'')
        +' <a href="'+esc(e.url||'#')+'" target="_blank" rel="noopener">open</a>'
        +(procoreOut(r)?stalePill('Completed in DocuSign'):'')+'</div>';
      // 3. Not executed anywhere: the status is all we have.
      if(procoreOut(r)) return '<div class="vsig">&#9998; <b>Out for signature</b> '
        +'<span class="muted" title="Procore holds no signature record for this commitment and no DocuSign envelope matched it">(no signer name)</span></div>';
      return '';
    }
    const who=x.with_names&&x.with_names.length?x.with_names.map(esc).join(', '):'';
    const side=x.with_side==='subcontractor' ? 'with the sub' : (x.with_side==='both' ? 'with both sides' : 'with us');
    const days=(x.days_waiting!=null)?(' &middot; '+x.days_waiting+' day'+(x.days_waiting===1?'':'s')):'';
    const sub=x.sub_signed===true ? ' &middot; sub has signed'
            : x.sub_signed===false ? ' &middot; sub not signed yet' : '';
    /* An envelope tied by vendor rather than by number says so, quietly. It is the one
       tier on this card that was inferred, so it should not read as firmly as the rest. */
    const byV = x.matched_by
      ? ' <span class="muted" title="'+(x.matched_by==='title'
          ? 'The envelope subject is this commitment\'s title. It is the only commitment with that title out for signature, and the only unmatched envelope carrying it.'
          : 'This envelope names the vendor and the job but not the commitment number. It is the only one open for this vendor on this job, and their only commitment out for signature here.')
        +'">~</span>' : '';
    const tip = (x.matched_by==='title' ? 'Matched on the commitment title, not a number — '
               : x.matched_by==='vendor' ? 'Matched by vendor and job, not by commitment number — ' : '')+(x.subject||'');

      +' <a href="'+esc(x.url||'#')+'" target="_blank" rel="noopener">open</a></div>';
  };

  const card=(cls,n,label,f)=>`<div class="card ${cls}" style="cursor:pointer" onclick="setFilter('${f}')" title="Click to filter"><div class="n">${n}</div><div class="l">${label}</div></div>`;
  const billyMiss = rows.filter(r=>r.w9_on_file==='No').length + rows.filter(r=>r.gcl_missing_billy==='Yes').length;

    (outSigCount ? card('soon',outSigCount,'Out for Signature','outsig') : '')+
    (ACTIVE_TAB==='cmgr' ? `<div class="card gap" style="cursor:pointer" onclick="switchTab('cmgr','docs')" title="Documents to add to Billy from Procore / Alabama"><div class="n">${billyMiss}</div><div class="l">Billy Missing Docs</div></div>` : '');
  let view=rows;
  if(filt==='nc') view=rows.filter(r=>r.status==='Non-Compliant');
  else if(filt==='compliant') view=rows.filter(r=>r.status==='Compliant');
  else if(filt==='soon') view=rows.filter(r=>r.status==='Expiring Soon');
  else if(filt==='nogcl') view=rows.filter(r=>r.gcl_required==='Yes' && (r.gcl_days==='missing' || (r.gcl_days!==''&&r.gcl_days!=='waived'&&!isNaN(Number(r.gcl_days))&&Number(r.gcl_days)<0)));
  else if(filt==='now9') view=rows.filter(r=>r.w9_on_file==='No');

  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  if(q) view=view.filter(r=>(r.vendor||'').toLowerCase().includes(q));
  const typeLabel = r => {
    if(r.vendor_type!=='Supplier') return r.vendor_type||'';
    if(r.site_type==='Third-Party Delivery') return 'Supplier (3rd-Party Delivery)';
    if(r.site_type==='On-Site') return 'Supplier (On-Site)';
    if(!r.site_type && r.delivery_rule==='Yes') return 'Supplier (site type unset)';
    return 'Supplier';
  };
  const noteHtml = n => (n||'').split('; ').map(seg=>{
    if(/verified on Alabama/i.test(seg)) return '<span style="color:#1a7f37">'+seg+'</span>';
    if(/upload|obtain|Missing|Expired|not on file|not in Billy|no Alabama match|not found|W-9 not/i.test(seg)) return '<span style="color:#b3261e">'+seg+'</span>';
    return seg;
  }).join(' &middot; ');
  function covChip(label,v,exp,extra){
    let cell;
    if(v==='n/a') cell='<span class="cpill muted">n/a</span>';

    else if(v==='missing') cell='<span class="cpill r">not submitted</span>';
    else if(v==='expired') cell='<span class="cpill r">expired</span>';
    else if(v==='unverified') cell='<span class="cpill y">unverified</span>';
    else if(v===''||v==null) cell='<span class="cpill muted">n/a</span>';
    else { const d=Number(v); if(isNaN(d)) cell='<span class="cpill muted">n/a</span>'; else if(d<0) cell='<span class="cpill r">expired</span>'; else cell='<span class="cpill '+(d<=THRESHOLD?'y':'g')+'">'+d+'</span>'; }
    const dstr=(exp && v!=='waived' && v!=='n/a')?'<span class="mdate">'+exp+'</span>':'';

  const okChip = v => '<span class="cpill '+(v==='Yes'?'g':'r')+'">'+v+'</span>';
  const reqItems = r => {
    const out=[];
    [['wc_days','Workers’ Compensation Insurance'],['ulel_days','Excess/Umbrella Liability Insurance'],['cgl_days','Commercial General Liability Insurance'],['auto_days','Commercial Automobile Insurance'],['prof_days','Professional Liability Insurance']].forEach(([k,label])=>{
      const v=r[k];

    });
    if(r.gcl_required==='Yes'){ const g=r.gcl_days;

  };

const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* =============================== REVIEW QUEUE ===============================
   What is sitting on Tiffany's desk, longest-stalled first.

   A row qualifies when compliance_pull.js flagged it: status Non-Compliant or
   Unverified AND nothing about it has changed for 3+ BUSINESS days. Expiring Soon
   is deliberately excluded - the vendor still has valid coverage, and escalating
   dates-on-a-calendar to the PM team teaches them to skim the list. Those rows
   stay visible under All Vendors.

   The clock starts the day compliance_pull.js first runs with stall tracking;
   nothing before that can be reconstructed, so early days will look quiet. */
function queueRows(){
  const items=(STATE&&STATE.items)||{};
  const byId={}, byPair={};
  for(const r of ROWS){
    if(r.billy_contract_id) byId[String(r.billy_contract_id)]=r;
    byPair[(r.project_number||'')+'|'+(r.vendor_id||'')]=r;
  }
  const out=[];
  for(const k of Object.keys(items)){
    const it=items[k]; if(it.escalate!=='Yes') continue;
    const row=byId[k]||byPair[k]||null;
    out.push({ key:k, days:Number(it.bizdays_unchanged||0), state:it, row:row,
               project:(row&&row.project)||it.project||'', vendor:(row&&row.vendor)||it.vendor||'',
               status:(row&&row.status)||it.status||'', notes:(row&&row.notes)||'',
               commitment:(row&&row.commitment)||it.commitment||'',
               email:(row&&row.vendor_email)||it.vendor_email||'',
               cstatus:(row&&row.commitment_status)||it.commitment_status||'',
               cexec:(row&&row.commitment_executed)||it.commitment_executed||'',
               /* Two different problems wear the same "Non-Compliant" badge: the vendor has
                  not sent documents, or the commitment itself is still Draft / Out For
                  Signature / unexecuted so there is nothing for them to submit against.
                  Chasing the vendor on the second one is the wrong move, and the PM is the
                  only person who can clear it - so the queue separates them. */
               blocked:((row&&row.commitment_blocked)||it.commitment_blocked||'')==='Yes',
               orphan:!row });
  }
  out.sort((a,b)=>b.days-a.days||a.project.localeCompare(b.project)||a.vendor.localeCompare(b.vendor));
  return out;
}
/* ---------------------- AWAITING YOUR REVIEW -------------------------------

   needs_attention/needs_review page shows, rebuilt from the documents endpoints
   because Billy exposes no API for that view.

function renderReview(){

  if(!proj.length&&!dir.length){
    /* An empty queue and an unusable signal look identical on screen unless we say so. */
    const suspicious=(st.documents_read>0 && !st.pending);
    return '<div class="gap-card"><h4>Awaiting your review</h4><div class="empty">'
      +(suspicious
        ? 'Every document in Billy carries a reviewed date, so nothing reads as pending. If Billy&rsquo;s <b>Needs Review</b> page is showing items, then <code>reviewed_on</code> is not what drives it &mdash; worth checking before trusting this as empty.'

/* A plain-text draft for the PM team. Deliberately factual and short: this list is
   read weekly, and a chasing tone is what gets a recurring email filtered. The
   Monday scheduled task writes the richer version that has also read Outlook. */
function queueEmailText(){
  const q=queueRows(); if(!q.length) return '';
  const byProj={}; for(const x of q){ (byProj[x.project||'(no project)']=byProj[x.project||'(no project)']||[]).push(x); }
  const projects=Object.keys(byProj).sort();
  let t='Subject: Outstanding subcontractor compliance — '+new Date().toLocaleDateString()+'\n\n';
  t+='The items below have had no movement in Billy for three or more business days. Each one is blocking on-site access and payment for that vendor.\n\n';
  for(const p of projects){
    t+=p+'\n';
    const rows=byProj[p].sort((a,b)=>b.days-a.days);
    const contractSide=rows.filter(x=>x.blocked), vendorSide=rows.filter(x=>!x.blocked);
    if(contractSide.length){
      t+='  Waiting on the commitment (not the vendor):\n';
      for(const x of contractSide){
        t+='    - '+x.vendor+(x.commitment?(' ('+x.commitment+')'):'')
          +' — commitment '+(x.cstatus||'status unknown')+(x.cexec==='No'?', not executed':'')
          +' — '+x.days+' business days unchanged\n';
      }
    }
    if(vendorSide.length){
      if(contractSide.length) t+='  Waiting on documents from the vendor:\n';
      for(const x of vendorSide){
        t+='    - '+x.vendor+(x.commitment?(' ('+x.commitment+')'):'')+' — '+x.status
          +(x.notes?('; '+x.notes):'')+' — '+x.days+' business days unchanged\n';
      }
    }
    t+='\n';
  }
  // Only say the contract line when there is actually something in that bucket.
  if(q.some(x=>x.blocked)) t+='Items listed as waiting on the commitment cannot be cleared by the subcontractor — the contract needs approving or executing in Procore first.\n';
  t+='If any of these are waiting on a waiver decision, let me know and I will note it.\n';
  return t;
}
function copyQueueEmail(btn){
  const t=queueEmailText(); if(!t) return;
  const done=ok=>{ const o=btn.textContent; btn.textContent=ok?'Copied ✓':'Copy failed'; setTimeout(()=>{btn.textContent=o;},1600); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>done(true),()=>done(false)); return; }
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); done(ok);
}

function lkEsc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function lkNorm(s){ return String(s||'').toUpperCase().replace(/&/g,' AND ').replace(/\b(LLC|L L C|INC|INCORPORATED|CO|COMPANY|CORP|CORPORATION|LP|LLP|PC|PLLC|LTD)\b/g,' ').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function lkParseLine(line){ let s=(line||'').trim(); if(!s) return null;
  const m=s.match(/^([A-Z0-9]{3,})\s*[-–]\s*(.+)$/); if(m) s=m[2];         // strip ComputerEase "CODE - Name"
  s=s.replace(/[.…]{2,}$/,'').replace(/…$/,'').trim(); return s; }    // drop trailing truncation dots

  return ROWS.filter(r=>{ if(r.contract_active==='No') return false;   // accounting: skip inactive contracts
    const v=lkNorm(r.vendor); if(!v) return false;
    if(v===nameNorm||v.startsWith(nameNorm)||nameNorm.startsWith(v)||v.includes(nameNorm)||nameNorm.includes(v)) return true;

    if(!A.size||!B.size) return false; let i=0; for(const t of A) if(B.has(t)) i++; return i/Math.min(A.size,B.size)>=0.75; }); }
function doLookup(){

  for(const line of raw){ const nm=lkParseLine(line); if(nm===null||nm==='') continue; const norm=lkNorm(nm);
    const matched=lkMatch(norm);
    if(!matched.length){ results.push({input:nm,row:null}); }
    else { const seen=new Set(); for(const r of matched){ const k=(r.vendor_id||r.vendor)+'|'+r.project; if(seen.has(k))continue; seen.add(k); results.push({input:nm,row:r}); } }
  }
  LOOKUP_RESULTS=results; renderLookupResults(results);
  document.getElementById('lookupExport').style.display = results.length?'':'none';
}
function renderLookupResults(results){
  const el=document.getElementById('lookupResults');
  if(!results.length){ el.innerHTML='<div class="empty">Paste vendor names above and click &ldquo;Look up COIs&rdquo;.</div>'; return; }
  const st=s=>'<span class="pill '+(s==='Compliant'?'g':s==='Expiring Soon'?'y':'r')+'">'+(s||'?')+'</span>';
  /* A blank expiry date has four completely different meanings on this tab, and an
     em dash flattens all of them into one. At time of payment the difference matters:
     "waived" and "n/a" are fine to pay against, "not submitted" and "expired" are not.
     The *_days columns already carry the distinction (dcol writes waived / missing /
     expired / a number / ''), so read those rather than only the date.
     Which coverages even apply is the same rule the vendor cards use: on a warranty
     job the on-site coverages no longer apply, Professional only where required (and
     in warranty only for a PSA), GCL only where required. */
  const notApplicable=(r,k)=>{
    const isW=(r.project_status||'').toLowerCase()==='warranty';
    const isProf=r.vendor_type==='Professional';
    if(k==='gcl')  return r.gcl_required!=='Yes';
    if(k==='prof') return !(r.prof_required==='Yes' && (!isW || isProf));
    if(isW && (k==='wc'||k==='ulel'||k==='auto')) return true;   // completed-ops only
    return false;
  };
  const expCell=(r,k,exp,days)=>{
    /* The pull is authoritative about what applies. applyDeliveryRule writes the literal
       'n/a' into the *_days columns for third-party-delivery suppliers — no on-site
       presence, so only GL can apply — and that rule is richer than anything this page
       can re-derive. Read it first; the local check below only covers cases the pull
       leaves to the reader (warranty, professional, GC licence). */
    if(days==='n/a')            return '<span class="muted" title="Does not apply to this vendor/contract">n/a</span>';
    if(notApplicable(r,k))      return '<span class="muted" title="Not required for this vendor/contract">n/a</span>';
    if(days==='waived')         return '<span class="muted" title="Waived in Billy">waived</span>';
    if(exp)                     return exp;
    if(days==='missing')        return '<span class="pill r" title="Requirement exists in Billy; nothing has ever been submitted">not submitted</span>';
    if(days==='expired'||(typeof days==='number'&&days<0))
                                return '<span class="pill r" title="Submitted and reviewed, now expired; Billy holds no expiration date">expired</span>';
    /* No requirement record at all. Not the same as "not submitted" - Billy is not
       tracking this coverage here, which on a Compliant row is worth questioning. */
    return '<span class="muted" title="No requirement record in Billy for this coverage">no record</span>';
  };
  const body=results.map(x=>{ if(!x.row) return '<tr class="notfound"><td>'+lkEsc(x.input)+'</td><td colspan="10">NOT FOUND in Billy</td></tr>';
    const r=x.row; const cls=r.status==='Non-Compliant'?'notfound':(r.status==='Expiring Soon'?'warn':'');
    const wtag=(r.project_status||'').toLowerCase()==='warranty'?' <span class="wtag">Warranty</span>':'';
    const gtag=r.global_coi==='Yes'?' <span class="gtag">Global COI</span>':'';
    return '<tr class="'+cls+'"><td>'+lkEsc(x.input)+'</td><td>'+lkEsc(r.vendor)+gtag+'</td><td>'+lkEsc(r.project)+wtag+'</td><td>'+st(r.status)+'</td><td>'+expCell(r,'cgl',r.cgl_exp,r.cgl_days)+'</td><td>'+expCell(r,'wc',r.wc_exp,r.wc_days)+'</td><td>'+expCell(r,'auto',r.auto_exp,r.auto_days)+'</td><td>'+expCell(r,'ulel',r.ulel_exp,r.ulel_days)+'</td><td>'+expCell(r,'prof',r.prof_exp,r.prof_days)+'</td><td>'+expCell(r,'gcl',(r.gcl_exp_alabama||r.gcl_exp_billy),r.gcl_days)+'</td></tr>'; }).join('');
  const nf=results.filter(x=>!x.row).length;
  el.innerHTML=(nf?'<div class="lkmini" style="margin-bottom:6px">'+nf+' of '+results.length+' line(s) not found — check spelling or that the vendor/project is active in Billy.</div>':'')
    +'<table class="lktable"><thead><tr><th>Searched</th><th>Matched Vendor</th><th>Project</th><th>Status</th><th>GL Exp</th><th>WC Exp</th><th>Auto Exp</th><th>UL/EL Exp</th><th>Prof Exp</th><th>GCL Exp</th></tr></thead><tbody>'+body+'</tbody></table>';
}
function exportLookup(){
  const cols=['Searched','Found','Matched Vendor','Global COI','Project','Warranty','Status','GL Exp','WC Exp','Auto Exp','UL/EL Exp','Prof Exp','GCL Exp'];
  const wchk=r=>(r.project_status||'').toLowerCase()==='warranty'?'Warranty':'';
  /* Same meanings as on screen, as plain text — a spreadsheet that reads blank where the
     page reads "waived" is how the two get quoted against each other in a payment dispute. */
  const expTxt=(r,k,exp,days)=>{
    if(days==='n/a') return 'n/a';   // set by applyDeliveryRule in the pull — authoritative
    const isW=(r.project_status||'').toLowerCase()==='warranty', isProf=r.vendor_type==='Professional';
    const na = k==='gcl' ? r.gcl_required!=='Yes'
             : k==='prof' ? !(r.prof_required==='Yes' && (!isW||isProf))
             : (isW && (k==='wc'||k==='ulel'||k==='auto'));
    if(na) return 'n/a';
    if(days==='waived') return 'waived';
    if(exp) return exp;
    if(days==='missing') return 'not submitted';
    if(days==='expired'||(typeof days==='number'&&days<0)) return 'expired';
    return 'no record';
  };
  const data=LOOKUP_RESULTS.map(x=>{ const r=x.row; return r?[x.input,'Yes',r.vendor||'',(r.global_coi==='Yes'?'Global':''),r.project||'',wchk(r),r.status||'',expTxt(r,'cgl',r.cgl_exp,r.cgl_days),expTxt(r,'wc',r.wc_exp,r.wc_days),expTxt(r,'auto',r.auto_exp,r.auto_days),expTxt(r,'ulel',r.ulel_exp,r.ulel_days),expTxt(r,'prof',r.prof_exp,r.prof_days),expTxt(r,'gcl',(r.gcl_exp_alabama||r.gcl_exp_billy),r.gcl_days)]:[x.input,'No','','','','','NOT FOUND','','','','','','']; });
  const aoa=[cols].concat(data);
  const dt=new Date(),pad=n=>String(n).padStart(2,'0'),stamp=dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate());
  if(typeof XLSX!=='undefined'){ const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:28},{wch:7},{wch:30},{wch:10},{wch:24},{wch:10},{wch:15},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12}]; ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:cols.length-1}})}; const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'COI Lookup'); XLSX.writeFile(wb,'COI_Lookup_'+stamp+'.xlsx'); return; }
  const cell=v=>{const s=v==null?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}; const csv=aoa.map(r=>r.map(cell).join(',')).join('\r\n'); const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='COI_Lookup_'+stamp+'.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
window.setFilter = function(v){ const el=document.getElementById('filt'); if(el){ el.value=v; render(); el.scrollIntoView({behavior:'smooth',block:'nearest'}); } };
async function loadLastReqMap(token){
  if(!SYNC_WORKER_URL) return;
  try{
    const r=await fetch(SYNC_WORKER_URL,{ method:'POST', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body:JSON.stringify({ action:'lr_get' }) });
    const j=await r.json(); if(j&&j.map) LR_MAP=j.map;
  }catch(e){ /* fall back to per-browser localStorage */ }
}
async function onRequestDocs(btn){
  const mailto=decodeURIComponent(btn.dataset.mailto||'');
  const vid=btn.dataset.vid, cid=btn.dataset.cid, isGlobal=btn.dataset.global==='1';
  if(SYNC_WORKER_URL && (vid||cid)){
    const orig=btn.textContent; btn.disabled=true; btn.textContent='Sending link…';
    try{
      const acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
      const t=await msalApp.acquireTokenSilent({ scopes:SCOPES, account:acct });
      await fetch(SYNC_WORKER_URL,{ method:'POST', headers:{ Authorization:'Bearer '+t.accessToken, 'Content-Type':'application/json' },
        body:JSON.stringify({ action:'request', vendor_id:vid?Number(vid):undefined, contract_id:cid?Number(cid):undefined, global:isGlobal }) });
      // remember the moment (Billy doesn't expose company-level request time on GET /vendors)
      const nowIso=new Date().toISOString(); const lk=isGlobal ? ('v:'+vid) : ('c:'+cid);
      setLocalLastReq(lk, nowIso); LR_MAP[lk]=nowIso;   // local + shared-map (Worker also persisted it to KV)
      render();
    }catch(e){ /* still open the email draft */ }
    btn.disabled=false; btn.textContent=orig;
  }
  if(mailto) window.location.href=mailto;
}
async function doSync(){
  const b=document.getElementById('syncbtn');
  if(!SYNC_WORKER_URL){ alert('Sync isn’t configured yet. The data still refreshes automatically on a schedule.'); return; }
  b.disabled=true; const orig=b.textContent; b.textContent='Syncing…';
  try{
    const acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
    const t=await msalApp.acquireTokenSilent({ scopes:SCOPES, account:acct });
    const r=await fetch(SYNC_WORKER_URL,{ method:'POST', headers:{ Authorization:'Bearer '+t.accessToken } });
    if(!r.ok) throw new Error((await r.text())||('HTTP '+r.status));
    b.textContent='Syncing… auto-refresh in ~90s';
    setTimeout(()=>location.reload(), 95000);
  }catch(e){ b.disabled=false; b.textContent=orig; alert('Sync failed: '+(e&&e.message||e)); }
}
load();
